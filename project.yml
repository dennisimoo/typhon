name: Typhon
options:
  bundleIdPrefix: dev.typhon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Typhon.xcconfig
  Release: Config/Typhon.xcconfig
packages:
  TyphonCore:
    path: TyphonCore
  PermissionFlow:
    url: https://github.com/jaywcjlove/PermissionFlow
    exactVersion: 2.11.4
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Typhon:
    type: application
    platform: macOS
    sources:
      - path: Typhon
    dependencies:
      - package: TyphonCore
      - package: PermissionFlow
        product: PermissionFlow
      - package: PermissionFlow
        product: SystemSettingsKit
      - package: Sparkle
    info:
      path: Typhon/Info.plist
      properties:
        CFBundleDisplayName: Typhon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 dennisimoo. MIT License."
        NSAccessibilityUsageDescription: Typhon reads the text field you're typing in so it can suggest fixes. Nothing leaves your Mac.
        SUFeedURL: https://github.com/$(GITHUB_REPOSITORY)/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        TyphonRepository: $(GITHUB_REPOSITORY)
    entitlements:
      path: Typhon/Typhon.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Ad-hoc and self-signed builds have no Team ID, so hardened runtime would refuse to
        # load the embedded Sparkle framework without this.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typhon.Typhon
        PRODUCT_NAME: Typhon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
schemes:
  Typhon:
    build:
      targets:
        Typhon: all
    run:
      config: Debug
    archive:
      config: Release
